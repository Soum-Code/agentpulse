name: release

# Pushing a tag like v0.1.0 publishes:
#   ghcr.io/soum-code/agentpulse-backend:{0.1.0,0.1,latest}
#   ghcr.io/soum-code/agentpulse-dashboard:{0.1.0,0.1,latest}
#   agentpulse-observe 0.1.0 on PyPI (import name stays `agentpulse`)
# Pull requests that touch a Dockerfile or the SDK only build, never push.
# See RELEASING.md for the one-time setup (PyPI trusted publisher, package visibility).

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "backend/**"
      - "dashboard/**"
      - "sdk/**"
      - ".github/workflows/release.yml"

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  OWNER: soum-code

jobs:
  sdk-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "./sdk[dev]"
      - run: pytest tests/test_sdk.py tests/test_llm_instrumentation.py -q
        # Run from the repo root: these tests live there, not under sdk/.

  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
          - name: dashboard
            context: ./dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/agentpulse-${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.source=https://github.com/Soum-Code/agentpulse
            org.opencontainers.image.licenses=MIT
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  sdk-publish:
    # Tags only, and only after the tests passed.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: sdk-test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write # PyPI trusted publishing; no API token is stored anywhere
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Tag must match the SDK version
        run: |
          want="${GITHUB_REF_NAME#v}"
          have=$(python - <<'PY'
          import tomllib
          print(tomllib.load(open("sdk/pyproject.toml", "rb"))["project"]["version"])
          PY
          )
          test "$want" = "$have" || { echo "tag $want != sdk/pyproject.toml $have"; exit 1; }
      - run: pip install build && python -m build sdk
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/dist/
