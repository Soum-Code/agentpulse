services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      # A named volume (not a host bind mount) for the SQLite data dir: WAL
      # mode needs a working shared-memory mmap, which Docker Desktop's
      # bind-mount translation on Windows doesn't support reliably (observed:
      # "disk I/O error" from PRAGMA journal_mode=WAL over a bind mount).
      - agentpulse_data:/data
      - ./models:/models
    env_file:
      - .env
    environment:
      - AGENTPULSE_DATABASE_URL=sqlite+aiosqlite:////data/agentpulse.db
      - AGENTPULSE_MODEL_CACHE_DIR=/models
      - AGENTPULSE_LOCAL_DEV_MODE=false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/v1/health', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Without this service the stack accepts spans and never evaluates them:
  # /v1/health/evaluator returns 503 and no score, drift value or alert is
  # ever produced. It reuses the backend image, overriding only the command.
  worker:
    build: ./backend
    command: ["python", "-m", "app.worker"]
    volumes:
      - agentpulse_data:/data
      - ./models:/models
    env_file:
      - .env
    environment:
      - AGENTPULSE_DATABASE_URL=sqlite+aiosqlite:////data/agentpulse.db
      - AGENTPULSE_MODEL_CACHE_DIR=/models
      - AGENTPULSE_LOCAL_DEV_MODE=false
    depends_on:
      # The API creates the schema on startup; the worker must not race it.
      - backend
    restart: unless-stopped

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        # No key in the build. A VITE_* value is inlined into the JavaScript that every
        # visitor downloads, so a key baked in here is public. nginx adds the key to /v1
        # requests at runtime instead (see `environment` below and nginx.conf.template).
        VITE_API_KEY: ""
        # Empty means same-origin: the SPA calls /v1/... and nginx proxies it
        # to the backend service. Baking an absolute URL here would point every
        # visitor's browser at their own machine rather than the server.
        VITE_API_URL: ${VITE_API_URL:-}
    environment:
      # Read by nginx at container start, never shipped to the browser. Same as the
      # dashboard service in docker-compose.release.yml.
      AGENTPULSE_API_KEY: ${AGENTPULSE_API_KEY:-change-me-to-a-secure-key}
    ports:
      - "5173:5173"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5173/"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  agentpulse_data:
