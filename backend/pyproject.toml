[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentpulse-backend"
version = "0.1.0"
description = "AgentPulse backend API server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "sqlmodel>=0.0.16,<1.0",
    "alembic>=1.13,<2.0",
    "aiosqlite>=0.20,<1.0",
    "pydantic>=2.0,<3.0",
    "numpy>=1.26,<3.0",
    "sentence-transformers>=3.0,<4.0",
    "transformers>=4.40,<5.0",
    "optimum[onnxruntime]>=1.19,<2.0",
    "python-dotenv>=1.0,<2.0",
    "python-multipart>=0.0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
