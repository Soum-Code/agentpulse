[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentpulse-backend"
version = "0.1.0"
description = "AgentPulse backend API server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "sqlmodel>=0.0.16,<1.0",
    "alembic>=1.13,<2.0",
    "aiosqlite>=0.20,<1.0",
    "pydantic>=2.0,<3.0",
    "numpy>=1.26,<3.0",
    "sentence-transformers>=3.0,<4.0",
    "transformers>=4.40,<5.0",
    # optimum 2.x split the ONNX Runtime integration into a separate package.
    # The old `optimum[onnxruntime]<2.0` pin held optimum at 1.27, whose
    # exporters import `_attention_scale` from torch.onnx.symbolic_opset14 --
    # removed in torch 2.13. The ONNX path therefore failed to load and silently
    # fell back to PyTorch on every start. Verified in an isolated environment
    # before changing this: identical inference (worst probability difference
    # 1.2e-08) at 1.97x the speed.
    "optimum~=2.1.0",
    "optimum-onnx[onnxruntime]~=0.1.0",
    "python-dotenv>=1.0,<2.0",
    "python-multipart>=0.0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
