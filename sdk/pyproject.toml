[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentpulse"
version = "0.1.0"
description = "Lightweight observability SDK for multi-agent LLM systems"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0,<3.0",
    "aiohttp>=3.9,<4.0",
    "python-ulid>=2.0,<3.0",
]

[project.optional-dependencies]
langgraph = ["langgraph>=0.2"]
langchain = ["langchain-core>=0.2"]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agentpulse"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
