server {
    listen 5173;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # ^~ so the regex block below is never consulted for API paths. Without
    # it, a request like /v1/something.json would match the file-extension
    # regex and be served from disk instead of proxied.
    location ^~ /v1/ {
        # Docker's embedded DNS server. Going through a variable is what forces
        # nginx to resolve the name per request rather than once at startup:
        # with a literal proxy_pass it caches the backend's IP, so recreating
        # that container hands it a new address and every proxied request then
        # returns 502 until nginx itself is restarted. A variable also means
        # the URI is no longer appended automatically, hence $request_uri —
        # which carries the query string along with the path.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_host backend;
        proxy_pass http://$backend_host:8000$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # A path that looks like a file must 404 when it is missing, instead of
    # falling through to the SPA shell below.
    #
    # Returning index.html with a 200 for a missing asset hides broken links,
    # pollutes caches with HTML under a .js URL, and makes the site
    # unverifiable in Google Search Console: verification deliberately requests
    # a filename that should not exist and treats a 200 as proof the server
    # cannot report 404, which would let anyone claim ownership of the site.
    location ~* \.(html|js|mjs|css|map|json|txt|xml|png|jpe?g|gif|svg|webp|ico|woff2?|ttf|eot)$ {
        try_files $uri =404;
    }

    # Everything else is an application route: hand it the shell and let the
    # router decide.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
