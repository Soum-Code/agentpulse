<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="AgentPulse">
  <!-- Near-black tile so the mark keeps its contrast against a light tab bar
       as well as a dark one. #050505 is the background the document body uses. -->
  <rect width="32" height="32" rx="7" fill="#050505"/>
  <!-- The pulse trace, drawn in the emerald of the live status dot in
       ProductHeader. scripts/generate_favicon.py reproduces these exact
       coordinates for the .ico and .png, so a change here belongs there too. -->
  <path d="M 5.5 16 L 11 16 L 14 8.5 L 18.5 23 L 21 16 L 26.5 16"
        fill="none" stroke="#34d399" stroke-width="3.4"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
