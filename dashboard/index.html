<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgentPulse — Observe. Evaluate. Investigate.</title>
    <meta name="description" content="AI agent observability, evaluation, investigation, and experimentation platform with dual public editorial and calm precision product modes." />
    <meta property="og:title" content="AgentPulse — Observe. Evaluate. Investigate." />
    <meta property="og:description" content="AI agent observability, evaluation, investigation, and experimentation platform with dual public editorial and calm precision product modes." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://agentpulse.centralindia.cloudapp.azure.com/" />
    <link rel="canonical" href="https://agentpulse.centralindia.cloudapp.azure.com/" />
    <!-- Google Search Console ownership proof. The token is issued by Google
         against the verifying account and is public by design: it lives in the
         served HTML. Google re-checks it periodically, so a build that drops it
         silently un-verifies the property. -->
    <meta name="google-site-verification" content="JAuKeWdLgMP1RyLY7nEz-neMA-NKEr7bwFJDioUKBY4" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- favicon.ico is listed for its own sake as well as the link: browsers
         request /favicon.ico by name regardless of what is declared here, and
         until the file existed that request returned 404 on every cold load.
         Browsers that understand the SVG prefer it and ignore the .ico. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Caveat is the .font-chalk face in index.css. It was being asked for
         without ever being loaded, so the chalk theme's handwritten
         annotations fell through to the generic `cursive` keyword, which is
         Comic Sans MS on Windows. -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@300;400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Caveat:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#050505] text-[#F5F5F7] antialiased selection:bg-neutral-800 selection:text-white overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
